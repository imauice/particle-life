
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'ParticleLifeWallpaper_AndroidStudio_BioAtom.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle ] || \
             [ -f settings.gradle.kts ]; then

            echo "Using normal Android source"
            PROJECT_DIR="$GITHUB_WORKSPACE"

          else
            echo "Extracting legacy ZIP"

            ZIP="ParticleLifeWallpaper_AndroidStudio_BioAtom.zip"

            if [ ! -f "$ZIP" ]; then
              echo "ERROR: Android project not found"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/android-project"
            unzip -q "$ZIP" \
              -d "$RUNNER_TEMP/android-project"

            SETTINGS=$(find "$RUNNER_TEMP/android-project" \
              -type f \
              \( -name settings.gradle -o \
                 -name settings.gradle.kts \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verify APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          find . -type f -path '*/build/outputs/apk/debug/*.apk'

          if ! find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | grep -q .; then

            echo "ERROR: APK not generated"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParticleLifeWallpaper-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
