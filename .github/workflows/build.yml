
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ParticleLifeWallpaper_AndroidStudio_BioAtom.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q ParticleLifeWallpaper_AndroidStudio.zip -d project
          find project -type f | head -40

      - name: Build APK
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParticleLifeWallpaper-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
